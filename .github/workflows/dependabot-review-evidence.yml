
name: Dependabot AI Review Evidence

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  evidence:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout Dependabot head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: workspace
          fetch-depth: 0
          persist-credentials: false

      - name: Verify Git history
        working-directory: workspace
        run: |
          echo "=== Current commit ==="
          git log -1 --oneline

          echo "=== Available branches ==="
          git branch -a

          echo "=== Check main branch ==="
          git show-ref refs/remotes/origin/main

          echo "=== Find common ancestor ==="
          git merge-base origin/main HEAD

      - name: Checkout the agent
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.VULNERABILITY_AGENT_REPOSITORY }}
          ref: ${{ vars.VULNERABILITY_AGENT_COMMIT }}
          path: agent
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the agent
        run: python -m pip install -r agent/requirements.txt poetry uv

      - name: Collect test, OSV, and RAG evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPORT_PATH: ${{ runner.temp }}/dependabot-review.json
        run: >-
          python agent/main.py workspace
          --review-pr "$PR_URL"
          --collect-only
          --report "$REPORT_PATH"

      - name: Upload review evidence
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-review-${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/dependabot-review.json
          if-no-files-found: error
          retention-days: 30
