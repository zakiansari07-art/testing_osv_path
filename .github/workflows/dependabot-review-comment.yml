
name: Dependabot AI Review Comment

on:
  workflow_run:
    workflows: [Dependabot AI Review Evidence]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write

    steps:
      # Verify the actual PR author, not the person who triggered the workflow.
      - name: Verify PR author
        id: verify-pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          author=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '.user.login')

          echo "PR author: $author"

          if [ "$author" = "dependabot[bot]" ]; then
            echo "is_dependabot=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dependabot=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout the agent
        if: steps.verify-pr.outputs.is_dependabot == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.VULNERABILITY_AGENT_REPOSITORY }}
          ref: ${{ vars.VULNERABILITY_AGENT_COMMIT }}
          path: agent
          persist-credentials: false

      - name: Download evidence from the completed run
        if: steps.verify-pr.outputs.is_dependabot == 'true'
        uses: actions/download-artifact@v4
        with:
          name: dependabot-review-${{ github.event.workflow_run.pull_requests[0].number }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: evidence

      - name: Find a direct link to the full evidence artifact
        if: steps.verify-pr.outputs.is_dependabot == 'true'
        id: report-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ARTIFACT_NAME: dependabot-review-${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            | jq -r --arg name "$ARTIFACT_NAME" '.artifacts[] | select(.name == $name) | .id' \
            | head -n 1)"

          if [ -z "$artifact_id" ]; then
            echo "Could not find the Dependabot evidence artifact for this run." >&2
            exit 1
          fi

          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts/${artifact_id}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.verify-pr.outputs.is_dependabot == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the agent
        if: steps.verify-pr.outputs.is_dependabot == 'true'
        run: python -m pip install -r agent/requirements.txt

      - name: Test GitHub API comment-read access
        if: steps.verify-pr.outputs.is_dependabot == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          set -euo pipefail

          echo "Testing GitHub API access..."

          gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq 'length'

          echo "GitHub API comment-read access successful."

      - name: Generate and post the PR review
        if: steps.verify-pr.outputs.is_dependabot == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
          REPORT_ARTIFACT_URL: ${{ steps.report-artifact.outputs.url }}
          LANGSMITH_TRACING: "true"
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}
        run: >-
          python agent/main.py
          --analyze-report evidence/dependabot-review.json
          --post-comment
          --report-artifact-url "$REPORT_ARTIFACT_URL"
          --expected-pr "$EXPECTED_PR"
          --expected-repository "$EXPECTED_REPOSITORY"
          --expected-head-sha "$EXPECTED_HEAD_SHA"
